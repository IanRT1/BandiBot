name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Python 3.11 has the broadest wheel support for the wake-word,
          # audio, and Kokoro dependencies used by this project.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Install build tooling
        run: python -m pip install build

      - name: Compile Python sources
        run: python -m compileall -q bot core music voice tests

      - name: Run tests
        env:
          # Tests mock external services; these placeholders only satisfy the
          # startup configuration validation during module imports.
          DISCORD_TOKEN: ci-placeholder
          OPENAI_API_KEY: ci-placeholder
          DEEPGRAM_API_KEY: ci-placeholder
          GEMINI_API_KEY: ci-placeholder
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Build wheel
        run: python -m build --wheel --no-isolation

      - name: Install and validate wheel
        env:
          WHEEL_TARGET: ${{ runner.temp }}/bandibot-wheel
        run: |
          python -m pip install --no-deps --target "$WHEEL_TARGET" dist/*.whl
          python - <<'PY'
          import glob
          import sys
          import zipfile
          from pathlib import Path

          wheel_path = Path(glob.glob("dist/*.whl")[0])
          with zipfile.ZipFile(wheel_path) as wheel:
              names = set(wheel.namelist())

          required = {
              "assets/BandiBot.onnx",
              "assets/wake_activation.wav",
              "data/instructions.example.txt",
              "data/server_info.example.txt",
              "core/paths.py",
          }
          missing = required - names
          assert not missing, f"missing wheel files: {sorted(missing)}"
          assert not any(name.startswith(("tests/", "build/")) for name in names)

          sys.path.insert(0, "${{ runner.temp }}/bandibot-wheel")
          from core.paths import assets_root, packaged_data_root

          assert (assets_root() / "BandiBot.onnx").is_file()
          assert (packaged_data_root() / "instructions.example.txt").is_file()
          print(f"validated {wheel_path.name}")
          PY
