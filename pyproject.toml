[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandibot"
version = "1.0.0"
description = "A self-hosted Discord bot with continuous voice listening and music playback"
authors = [{name = "IanRT1"}]
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4,<3.0",
    "discord-ext-voice-recv>=0.4.2a145,<1.0",
    "aiohttp>=3.9,<4.0",
    "PyNaCl>=1.5,<2.0",
    "openai>=1.60,<2.0",
    "deepgram-sdk>=3.7,<4.0",
    "openwakeword>=0.6,<1.0",
    "onnxruntime>=1.17,<2.0",
    "silero-vad>=5.1,<7.0",
    "torch>=2.3,<3.0",
    "numpy>=1.26,<3.0",
    "sentence-transformers>=3.0,<6.0",
    "kokoro>=0.9,<1.0",
    "yt-dlp>=2025.1.15,<2027.0",
    "mutagen>=1.47,<2.0",
    "Pillow>=10.3,<12.0",
    "python-dotenv>=1.0,<2.0",
    "audioop-lts>=0.2,<1.0; python_version >= '3.13'",
]

[project.scripts]
bandibot = "core.client:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
# Avoid temporary cache directories left by restricted Windows sessions.
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["."]
include = ["assets", "assets.*", "bot", "bot.*", "core", "core.*", "data", "data.*", "music", "music.*", "voice", "voice.*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
assets = ["*.onnx", "*.wav", "*.ico"]
data = ["*.example.txt"]
