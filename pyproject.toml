[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bandibot"
version = "1.0.0"
description = "A self-hosted Discord bot with continuous voice listening and music playback"
authors = [{name = "IanRT1"}]
requires-python = ">=3.11"

[project.scripts]
bandibot = "core.client:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
# Avoid temporary cache directories left by restricted Windows sessions.
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["."]
